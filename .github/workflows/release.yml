name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        run: test "v$(tr -d '\n' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Install host check tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run host and runtime safety checks
        run: |
          shellcheck --severity=warning scripts/*.sh tests/*.sh
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          sh -n tests/runtime-safety.sh
          sh tests/runtime-safety.sh
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests/source -v
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from kmodlib import matrix; assert len(matrix()[0]) == 9'
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          groups = json.load(open("targets/groups.yaml"))["groups"]
          print("value=" + json.dumps({"include": [
              {"group": name, "model": item["representative"]}
              for name, item in groups.items()
          ]}, separators=(",", ":")))
          PY

  build:
    needs: matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.value) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-12 g++-12 flex bison gawk gettext \
            git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file \
            wget curl jq xxd zstd kmod binutils bc gperf attr lzip \
            protobuf-c-compiler libhtml-parser-perl libjson-perl libxml-libxml-perl
      - name: Prepare pinned SDK
        run: ./scripts/prepare-sdk.sh
        env:
          CC: gcc-12
          HOSTCC: gcc-12
          CXX: g++-12
      - uses: actions/cache@v4
        with:
          path: |
            .cache/keenetic-sdk/dl
            .cache/keenetic-sdk/downloads
            .cache/keenetic-sdk/staging_dir
            .cache/keenetic-sdk/toolchain-*
            .cache/keenetic-sdk/build_dir
          key: ${{ runner.os }}-sdk-${{ hashFiles('sdk.lock') }}-${{ matrix.model }}-${{ hashFiles('package/Makefile', 'src/**', 'scripts/**', 'VERSION') }}
          restore-keys: |
            ${{ runner.os }}-sdk-${{ hashFiles('sdk.lock') }}-${{ matrix.model }}-
      - name: Build ${{ matrix.group }} (${{ matrix.model }})
        run: ./scripts/build.sh "${{ matrix.group }}"
        env:
          CC: gcc-12
          HOSTCC: gcc-12
          CXX: g++-12
      - uses: actions/upload-artifact@v4
        with:
          name: keenpbr-${{ matrix.group }}
          path: out/**
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install artifact inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils kmod
      - uses: actions/download-artifact@v4
        with:
          pattern: keenpbr-*
          path: out
          merge-multiple: true
      - name: Validate version and assemble release files
        run: |
          test "v$(tr -d '\n' < VERSION)" = "$GITHUB_REF_NAME"
          python3 scripts/generate-manifest.py --out out --release-dir out/release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/release/* --title "$GITHUB_REF_NAME" --generate-notes
