name: Refresh Keenetic SDK matrix

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

concurrency:
  group: keenpbr-refresh-matrix
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    container: python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install pinned matrix environment
        run: .ci/setup-build-env.sh
      # Repeat after Git is installed to obtain history instead of an archive.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Start from current main
        run: git fetch origin main
      - name: Regenerate against current main and retry concurrent updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/refresh-matrix.py \
              --sdk https://github.com/keenetic/keenetic-sdk.git \
              --kernel-git https://github.com/keenetic/kernel-49.git \
              --repository https://github.com/keenetic/keenetic-sdk.git \
              --output kernel-matrix.json
            if git diff --quiet -- kernel-matrix.json; then
              echo "kernel-matrix.json is unchanged"
              exit 0
            fi
            git add -- kernel-matrix.json
            git commit -m "Refresh Keenetic SDK matrix"
            if git push origin HEAD:main; then
              source_ref="$(git rev-parse HEAD)"
              python3 - "$GITHUB_REPOSITORY" "$GH_TOKEN" "$source_ref" <<'PY'
          import json, sys, urllib.error, urllib.request
          repo, token, source_ref = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/build.yml/dispatches",
              data=json.dumps({"ref": "main", "inputs": {"source_ref": source_ref}}).encode(),
              headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {token}",
                       "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(request) as response:
                  if response.status != 204:
                      raise SystemExit(f"workflow dispatch failed: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"workflow dispatch failed: HTTP {exc.code}: {exc.read().decode()}")
          print(f"Dispatched build.yml for source_ref={source_ref}")
          PY
              exit 0
            fi
            echo "main advanced during matrix refresh; retrying against current main (attempt $attempt/3)" >&2
          done
          echo "main kept advancing; retry the scheduled/manual matrix refresh" >&2
          exit 1
