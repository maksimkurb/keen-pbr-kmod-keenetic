name: build

on:
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          groups = json.load(open("targets/groups.yaml"))["groups"]
          if "${{ github.event_name }}" == "pull_request":
              wanted = {"KN-1810", "KN-1812"}
              matrix = [{"group": name, "model": item["representative"]}
                        for name, item in groups.items()
                        if item["representative"] in wanted]
              if {item["model"] for item in matrix} != wanted:
                  raise SystemExit("PR representatives missing from groups.yaml")
          else:
              matrix = [{"group": name, "model": item["representative"]}
                        for name, item in groups.items()]
          print("value=" + json.dumps({"include": matrix}, separators=(",", ":")))
          PY

  build:
    needs: targets
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-12 g++-12 flex bison gawk gettext \
            git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file \
            wget curl jq xxd zstd shellcheck kmod binutils bc gperf attr lzip \
            protobuf-c-compiler libhtml-parser-perl libjson-perl libxml-libxml-perl
      - name: Host checks
        run: |
          shellcheck --severity=warning scripts/*.sh tests/*.sh
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          sh -n tests/runtime-safety.sh
          sh tests/runtime-safety.sh
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests/source -v
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from kmodlib import matrix; assert len(matrix()[0]) == 9'
      - name: Prepare pinned SDK
        run: ./scripts/prepare-sdk.sh
        env:
          CC: gcc-12
          HOSTCC: gcc-12
          CXX: g++-12
      - uses: actions/cache@v4
        with:
          path: |
            .cache/keenetic-sdk/dl
            .cache/keenetic-sdk/downloads
            .cache/keenetic-sdk/staging_dir
            .cache/keenetic-sdk/toolchain-*
            .cache/keenetic-sdk/build_dir
          key: ${{ runner.os }}-sdk-${{ hashFiles('sdk.lock') }}-${{ matrix.model }}-${{ hashFiles('package/Makefile', 'src/**', 'scripts/**', 'VERSION') }}
          restore-keys: |
            ${{ runner.os }}-sdk-${{ hashFiles('sdk.lock') }}-${{ matrix.model }}-
      - name: Build ${{ matrix.group }} (${{ matrix.model }})
        run: ./scripts/build.sh "${{ matrix.group }}"
        env:
          CC: gcc-12
          HOSTCC: gcc-12
          CXX: g++-12
      - uses: actions/upload-artifact@v4
        with:
          name: keenpbr-${{ matrix.group }}
          path: out/**
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install artifact inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils kmod
      - uses: actions/download-artifact@v4
        with:
          pattern: keenpbr-*
          path: out
          merge-multiple: true
      - name: Assemble and validate full matrix release files
        run: python3 scripts/generate-manifest.py --out out --release-dir out/release
      - uses: actions/upload-artifact@v4
        with:
          name: keenpbr-nightly-${{ github.run_number }}
          path: out/release/**
          if-no-files-found: error
          retention-days: 14
