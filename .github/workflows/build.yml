name: Build SDK snapshot

on:
  pull_request:
    paths:
      - ".ci/**"
      - ".github/workflows/**"
      - "kernel-matrix.json"
      - "LICENSE"
      - "package/Makefile"
      - "scripts/**"
      - "sdk.lock"
      - "src/**"
      - "tests/**"
      - "VERSION"
  push:
    branches: [main]
    paths:
      - ".ci/**"
      - ".github/workflows/**"
      - "kernel-matrix.json"
      - "LICENSE"
      - "package/Makefile"
      - "scripts/**"
      - "sdk.lock"
      - "src/**"
      - "tests/**"
      - "VERSION"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact repository commit to build
        required: true
        default: main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: keenpbr-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
    runs-on: ubuntu-22.04
    container:
      image: python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941
      options: --platform linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install pinned check environment
        run: .ci/setup-build-env.sh
      # The slim image has no Git; the first checkout only bootstraps setup.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Run source and runtime safety checks
        run: |
          shellcheck .ci/setup-build-env.sh scripts/*.sh tests/runtime-safety.sh
          python3 -m unittest discover -s tests/source -v
          bash tests/runtime-safety.sh
      - name: Record checked commit
        id: source
        run: echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  plan:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [check]
    runs-on: ubuntu-22.04
    container:
      image: python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941
      options: --platform linux/amd64
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.source_ref }}
      - name: Install pinned SDK build environment
        run: .ci/setup-build-env.sh
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.source_ref }}
      - name: Plan complete matrix coverage
        id: plan
        run: |
          mkdir -p out
          python3 scripts/plan-builds.py --matrix kernel-matrix.json \
            --descriptors out/descriptors --output out/plan.json
          python3 - <<'PY'
          import json, os
          plan = json.load(open("out/plan.json"))
          shards = [{"shard": item["shard"]} for item in plan["shards"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("shards=" + json.dumps({"include": shards}, separators=(",", ":")) + "\n")
              output.write("source_ref=" + __import__("subprocess").check_output(["git", "rev-parse", "HEAD"], text=True).strip() + "\n")
          PY
      - name: Index the newest published snapshot for verified reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reuse-release.py --fetch-index --repository "$GITHUB_REPOSITORY" --token "$GH_TOKEN" --output out/reuse-index
      - uses: actions/upload-artifact@v4
        with:
          name: keenpbr-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/plan.json
            out/descriptors/*.json
            out/reuse-index/**
          if-no-files-found: error
          retention-days: 7

  build:
    needs: plan
    runs-on: ubuntu-22.04
    container:
      image: python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941
      options: --platform linux/amd64
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - name: Install pinned SDK build environment
        run: .ci/setup-build-env.sh
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: keenpbr-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
      - name: Prepare archives-only cache
        run: install -d -m 755 -o builder -g builder /build/downloads
      - uses: actions/cache@v4
        with:
          path: /build/downloads
          key: sdk-downloads-${{ hashFiles('.ci/build-environment.json') }}-${{ matrix.shard }}-${{ hashFiles('kernel-matrix.json') }}
          restore-keys: |
            sdk-downloads-${{ hashFiles('.ci/build-environment.json') }}-${{ matrix.shard }}-
      - name: Build shard serially
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chown -R builder:builder out /build/downloads
          runuser --user builder -- env python3 scripts/reuse-release.py \
            --index out/reuse-index --plan out/plan.json --shard "${{ matrix.shard }}" \
            --output out/builds --token "$GH_TOKEN"
          runuser --user builder -- env JOBS=4 python3 scripts/build-snapshot.py \
            --plan out/plan.json --descriptors out/descriptors --shard "${{ matrix.shard }}" --out out \
            --download-cache /build/downloads
      - uses: actions/upload-artifact@v4
        with:
          name: keenpbr-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: out/builds/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [plan, build, check]
    runs-on: ubuntu-22.04
    container:
      image: python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941
      options: --platform linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - name: Install pinned audit tools
        run: .ci/setup-build-env.sh
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: keenpbr-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: keenpbr-build-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: out/builds
          merge-multiple: true
      - name: Assemble and verify immutable snapshot
        id: assemble
        run: |
          python3 scripts/assemble-release.py --matrix kernel-matrix.json --plan out/plan.json \
            --builds-dir out/builds --output-dir out/snapshots --notes-file out/release-notes.md \
            --repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --reuse-index out/reuse-index | tee out/snapshot-path.txt
          snapshot="$(cat out/snapshot-path.txt)"
          (cd "$snapshot" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: keenpbr-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/snapshots/modules-*/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: keenpbr-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [plan, assemble]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: python:3.14.2-slim-bookworm@sha256:e87711ef5c86aaeaa7031718a69db79d334d94c545c709583f651b8185870941
      options: --platform linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: keenpbr-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/snapshots
      - uses: actions/download-artifact@v4
        with:
          name: keenpbr-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/notes
      - name: Publish a checksum-complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(find out/notes -type f -name release-notes.md -print -quit)"
          snapshot="$(find out/snapshots -type f -name manifest.json -print0 -quit | xargs -0 -r dirname)"
          test -n "$notes" && test -n "$snapshot"
          python3 scripts/publish-snapshot.py --snapshot "$snapshot" --notes "$notes" \
            --repository "$GITHUB_REPOSITORY" --target-commit "${{ needs.plan.outputs.source_ref }}" \
            --token "$GH_TOKEN"
